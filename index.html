<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ستار ميوزيك</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            text-align: center;
        }
        h1 { 
            font-size: 36px; 
            margin-bottom: 15px;
            background: linear-gradient(90deg, #e94560, #f77f00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #aaa; line-height: 1.8; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #e94560, #f77f00);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            margin: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 ستار ميوزيك</h1>
        <p>مرحباً بك في موقع Star Music</p>
        <a href="#" class="btn">🎧 استمع الآن</a>
    </div>
</body>
</html>
